name: fetch-union-aug2026

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q curl_cffi
      - name: Fetch Union August 2026
        run: python scripts/fetch_union_aug2026.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: union-aug-2026
          path: union-aug-2026/
          if-no-files-found: warn
          retention-days: 3
